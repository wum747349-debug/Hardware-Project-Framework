name: Framework contract check

on:
  push:
    paths:
      - "PROJECT_RULES.md"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "skills/**"
      - "checklists/**"
      - "templates/**"
      - "examples/**"
      - "projects/**"
      - "scripts/**"
      - ".github/workflows/repository-framework-check.yml"
  pull_request:
    paths:
      - "PROJECT_RULES.md"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "skills/**"
      - "checklists/**"
      - "templates/**"
      - "examples/**"
      - "projects/**"
      - "scripts/**"
      - ".github/workflows/repository-framework-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run canonical full Framework validation
        run: python scripts/validate_framework_repository.py
